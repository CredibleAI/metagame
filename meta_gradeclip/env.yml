name: metagradeclip
channels:
  - conda-forge
  - nvidia
  - pytorch
dependencies:
  - python=3.12
  - pytorch=2.6.0=*cuda126*
  - torchvision=0.21.0=*cuda126*
  - cuda-runtime=12.6
  - captum
  - opencv
  - datasets
  - diffusers
  - accelerate
  - transformers>=4.57,<5 # pinned for meta clip 2
  - scikit-learn
  - scikit-image
  - xgboost
  - keras
  - ftfy
  - tqdm
  - regex
  - fire
  - einops
  - protobuf
  - seaborn
  - jupyter
  - ipykernel
  - ipywidgets
  - pip
  - pip:
      - git+https://github.com/openai/clip.git
      - git+https://github.com/mmschlk/shapiq
      - sentencepiece==0.2.0
      - invisible-watermark